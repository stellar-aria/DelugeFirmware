[package]
name = "region-differential"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

# Standalone harness crate — deliberately NOT a workspace member (mirrors
# fs_differential): it `cc`-compiles a slice of the app's C++ into its own test
# binary and must not perturb the firmware/BSP Cargo graph.

[dependencies]
deluge_sample_source = { path = "../../../../crates/deluge_sample_source" }

[dev-dependencies]
critical-section = { version = "1", features = ["std"] }

[build-dependencies]
cc = "1"
