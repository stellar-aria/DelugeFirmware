# deluge-bsp-rust: the Rust/Embassy firmware image (Cargo-top). Implements the
# <libdeluge/...> C-ABI boundary for the Synthstrom Deluge (Renesas RZ/A1L) on
# top of the sibling deluge-sdk HAL+BSP, OWNS reset/main/_start + the Embassy
# executor, and links the portable C++ application (built by CMake into
# libdeluge_app.a) — running deluge_main() in one Embassy task.
#
# Standalone crate (NOT a workspace member). The path deps below sit inside the
# deluge-sdk Cargo workspace, so their `workspace = true` embassy pins resolve
# against that workspace and stay version-locked.
[package]
name = "deluge-bsp-rust"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "deluge-rust"
path = "src/main.rs"
test = false

[dependencies]
# Truly cross-target deps: same source, same versions, on both device and host.
embassy-sync = "0.8.0"
embassy-futures = "0.1.2"
log = "0.4"
rtt-target = { version = "0.6", features = ["log"], optional = true }

# Sibling deluge-sdk BSP + HAL (DelugeFirmware and deluge-sdk cloned side by
# side). Both are dual-target as of deluge-sdk's feat/deluge-bsp-host: `sd`
# (block_device.h's backing store) has the SAME async `Result<_, SdError>` API
# on host (a file-backed disk image) and device (the real SDHI1 driver), so
# `deluge-bsp-rust`'s `sd.rs` can call `deluge_bsp::sd::*` uniformly with no
# `#[cfg]` at the call site (see sd.rs). `rza1l-hal` is dual-target too
# (`target_os = "none"` gates its hardware-touching internals; its host build
# is effectively inert but the crate itself compiles either way). Both are
# therefore shared deps now rather than device-only.
# `flash` feature: deluge-bsp gates its `flash` module behind an opt-in feature
# (only flash-writing firmwares need it). We do — src/flash.rs reads device
# settings from the reserved SPI-flash sector via deluge_bsp::flash.
deluge-bsp = { path = "../../../../deluge-sdk/crates/deluge-bsp", features = ["flash"] }
rza1l-hal = { path = "../../../../deluge-sdk/crates/rza1l-hal" }

# ── Device (the Deluge, armv7a-none-eabihf) ──────────────────────────────────
# `deluge-alloc` (the general-purpose Rust heap) has no host meaning — the host
# harness links no C++ app and does no SDRAM bring-up (see build.rs) — so it
# stays device-only.
#
# `platform-cortex-ar` and `platform-std` (host, below) are mutually exclusive
# by embassy-executor's `check_at_most_one!`, so they must live in disjoint
# `[target...]` sections rather than both landing in `[dependencies]`.
[target.'cfg(target_os = "none")'.dependencies]
deluge-alloc = { path = "../../../../deluge-sdk/crates/deluge-alloc" }

# SP1: the device `BlockDevice`/`BufStream`/`embedded-fatfs` storage stack
# (`fat_block_device.rs`) — same vendored crates `fs_differential`'s host
# adapter already exercises, wired here onto the real SD driver.
block-device-driver = { path = "../../../crates/block-device-driver" }
block-device-adapters = { path = "../../../crates/block-device-adapters" }
aligned = "0.4"
embedded-fatfs = { path = "../../../crates/embedded-fatfs", default-features = false, features = ["lfn", "alloc"] }
# `embedded-fatfs`'s `alloc` feature (above) is the first thing on this
# no_std target to actually need `extern crate alloc`, which requires a
# registered `#[global_allocator]` (see main.rs's `FS_ALLOCATOR`) — nothing
# here used `alloc` before. Renamed via `package =` to `fs_alloc`: this
# crate's OWN `crates/deluge_alloc` (TLSF heap) would otherwise collide, as
# an unqualified dependency, with the sibling deluge-sdk `deluge-alloc` crate
# already above (both normalize to the same `deluge_alloc` identifier).
fs_alloc = { package = "deluge_alloc", path = "../../../crates/deluge_alloc" }

# DelugeFirmware's residency/eviction engine + GeneralMemoryAllocator backing
# (TLSF + slab), exposed as C ABIs the archived C++ deluge_app calls. Linked
# directly (not via the `deluge_rust` umbrella crate, whose #[panic_handler]
# would collide with ours). A distinct allocator from the sibling `deluge-alloc`
# above — disjoint memory and consumers, no C-symbol overlap; deluge_alloc rides
# in transitively via deluge_resource.
deluge_resource = { path = "../../../crates/deluge_resource" }

# Embassy runtime — versions match deluge-sdk's workspace pins.
embassy-executor = { version = "0.10.0", features = ["nightly", "platform-cortex-ar", "executor-thread", "executor-interrupt"] }
embassy-time = { version = "0.5.1", features = ["tick-hz-1_000_000"] }
embassy-usb = "0.6.0"
embassy-usb-driver = "0.2.2"

cortex-ar = "0.3"
critical-section = "1"

# ── Host (x86/std) ────────────────────────────────────────────────────────────
# Same source, but the executor is std-thread-backed with no cortex-ar/BSP deps,
# so the Embassy scheduler/fiber concurrency can be exercised off-hardware
# (e.g. under ThreadSanitizer). No C++ app is linked on host (see build.rs).
[target.'cfg(not(target_os = "none"))'.dependencies]
embassy-executor = { version = "0.10.0", features = ["nightly", "platform-std", "executor-thread"] }
embassy-time = { version = "0.5.1", features = ["std"] }
critical-section = { version = "1", features = ["std"] }
# Host `main`'s logger (device uses `log` over RTT instead; see the `rtt` feature).
env_logger = "0.11"
# Host implementation of fiber.rs's low-level switch (`corosensei::Coroutine`/
# `Yielder`), standing in for the device's ARM `fiber_switch` global_asm. Its
# `sanitize` feature (below) is ASan-only — see that feature's comment.
corosensei = "0.3"
# The host-built C++ `deluge_app` closure (host_app feature) calls the same
# deluge_resource_* / deluge_{alloc,slab_*,heap_*} C ABIs the device resolves via
# the dep above. On host these crates are plain std rlibs (no panic_handler, no
# dup-handler risk). Optional + gated by `host_app` so a plain host build never
# pulls it in.
deluge_resource = { path = "../../../crates/deluge_resource", optional = true }

[features]
default = ["rtt", "async_streaming_loader"]

## RTT (SEGGER Real-Time Transfer) logging over a debug probe: selects the
## rza1l_rtt.x linker script (via build.rs) and registers the log logger.
rtt = ["dep:rtt-target", "rza1l-hal/rtt"]

## corosensei sanitizer instrumentation for the host fiber switch. ASan-only: it
## wires AddressSanitizer's `__sanitizer_*_switch_fiber` API, which ThreadSanitizer's
## runtime doesn't implement, so `-Zsanitizer=thread` fails to link with it on.
## Off by default (enabling it without a sanitizer build causes linker errors).
sanitize = ["corosensei/sanitizer"]

## Link the host-built C++ `deluge_app` object and bindgen the libdeluge headers
## for the host ABI, so the host binary can reach the C++ app boundary without a
## device build. Pulls in the host-side `deluge_resource` dep. Off by default.
host_app = ["dep:deluge_resource"]

## Diagnostic: make `deluge_block_read`/`deluge_block_write` debug_assert! the
## caller is on the storage worker fiber, surfacing card transfers not yet on the
## single-owner path. Off by default. See include/libdeluge/storage_owner.h.
storage-owner-audit = []

## Host-harness only: give host SD reads/writes a modeled per-transfer latency so
## a transfer on the storage-owner fiber genuinely suspends (yields the executor)
## instead of the host's never-suspend `block_on`. Data is unchanged — only timing
## is modeled. Off by default (off = byte-identical to no feature).
sim_latency = []

## Build + spawn the Rust async cluster-fill task (`streaming_loader.rs`), which
## drains the resource-manager loader queue and awaits the SD read instead of the
## C++ fiber pump running it inline. The selector/wakeup C-ABI
## (`deluge_streaming_async_active`/`_signal_fill`) is always compiled so the C++
## side always has a real symbol; `async_active()`'s return value is the switch
## (false ⇒ `loader.cpp`'s fiber pump behaves exactly as before). On by default;
## opt out with --no-default-features.
async_streaming_loader = []

[build-dependencies]
# Generate Rust signatures + POD types from the canonical libdeluge C headers so
# the boundary can't drift (type mismatch = compile error).
bindgen = "0.70"

# Redirect embassy-executor to the local fork that ports the InterruptExecutor to
# platform-cortex-ar (GIC SGI pender). Same version (0.10.0), so this patch applies
# across the whole graph (this crate + the deluge-sdk path-deps), keeping the
# Executor/Spawner types identical everywhere.
#
# The integrated timer queue is *intrusive*: embassy-executor stores a
# `TimerQueueItem` in each task header (via embassy-executor-timer-queue), and
# embassy-time-queue-utils reads it back through `TimerQueueItem::from_embassy_waker`.
# `embassy-executor-timer-queue` carries no `links` key, so without these extra
# patches Cargo silently links TWO copies — the fork's (writing the task header,
# pulled in by the forked embassy-executor) and crates.io's (reading it, pulled in
# by the unpatched embassy-time-queue-utils the HAL driver uses). The two item
# types don't match, so `schedule_wake` reads a garbage item, thinks the task is
# already queued, and returns false → the hardware alarm is never armed → every
# `Timer::await` hangs forever. Patch the whole intrusive timer-queue pair to the
# fork so a single, consistent `TimerQueueItem` type is used on both sides.
[patch.crates-io]
embassy-executor = { git = "https://github.com/stellar-aria/embassy", branch = "feat/executor-interrupt-a9" }
embassy-executor-timer-queue = { git = "https://github.com/stellar-aria/embassy", branch = "feat/executor-interrupt-a9" }
embassy-time-queue-utils = { git = "https://github.com/stellar-aria/embassy", branch = "feat/executor-interrupt-a9" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = true
panic = "abort"

[profile.dev]
opt-level = 1
debug = true
panic = "abort"
