name: Nightly Build

# NOTE: the `build` job in build.yml is disabled (see its `if: false` and the
# comment there), so `nightly-build` below (which calls build.yml) is itself
# skipped and produces no firmware artifact. `nightly-publish` needs
# `nightly-build` with no `if:` override, so it is skipped in turn — its
# steps never run, and nothing gets published.
on:
  workflow_dispatch: # allows manual triggering
# To enable scheduled nightly builds, uncomment the schedule below:
#  schedule:
#    - cron: "14 0 * * *" # runs daily at 00:14

jobs:
  nightly-detect:
    runs-on: ubuntu-latest
    outputs:
      new-commits: ${{ steps.count-commits.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Get new commits if branch exists
        id: count-commits
        run: |
          if git show-ref --verify --quiet refs/remotes/origin/next; then
            echo "Branch next exists, checking for commits"
            git checkout next
            count=$(git log --oneline --since '24 hours ago' | wc -l)
            echo "Saw $count commits"
            echo "count=$count" >> $GITHUB_OUTPUT
          else
            echo "Branch next does not exist, skipping"
            echo "count=0" >> $GITHUB_OUTPUT
          fi
  nightly-build:
    uses: ./.github/workflows/build.yml
    needs: nightly-detect
    if: needs.nightly-detect.outputs.new-commits > 0
    with:
      firmware-retention-days: 30
      build-type: "Release"
      build-tag: "nightly"
      branch: "next"
  nightly-publish:
    uses: ./.github/workflows/publish.yml
    needs: nightly-build
    with:
      tag: "nightly"
      branch: "next"

  harness-nightly-matrix:
    name: harness matrix (nightly)
    runs-on: ubuntu-latest
    outputs:
      harness: ${{ steps.emit.outputs.harness }}
    steps:
      - uses: actions/checkout@v7
      - id: emit
        run: echo "harness=$(DBT_NOENV=1 DBT_NO_SYNC=1 ./dbt harness ci --tier nightly | jq -c .harness)" >> "$GITHUB_OUTPUT"

  harness-nightly:
    name: harness (${{ matrix.harness }})
    needs: harness-nightly-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        harness: ${{ fromJSON(needs.harness-nightly-matrix.outputs.harness) }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Install prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang ninja-build qemu-user g++-arm-linux-gnueabihf mtools
      - name: Check out the sibling deluge-sdk
        uses: actions/checkout@v7
        with:
          repository: FirestormAudio/deluge-embassy
          ref: 07c4aabc477c44524afc87907eb703c24c88b674
          path: deluge-sdk-checkout
      # The harnesses reach it as a SIBLING of the repo root, not a subdirectory.
      - name: Place it beside the workspace
        run: mv deluge-sdk-checkout ../deluge-sdk
      - name: Build the host-app object closure
        # -DDELUGE_SIM_X64=ON is REQUIRED, not optional: the sim defaults to a
        # -m32 configuration, which link-fails against the Rust harnesses'
        # 64-bit host target on a bare x86 Linux box — including this runner.
        run: cmake -B build-embassy-hostapp -S sim -G Ninja -DDELUGE_SIM_X64=ON && cmake --build build-embassy-hostapp
      - name: Run harness
        run: DBT_NOENV=1 DBT_NO_SYNC=1 ./dbt harness run ${{ matrix.harness }}
