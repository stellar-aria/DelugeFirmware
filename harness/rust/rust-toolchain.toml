# Covers every package beneath this directory: rustup searches upward from the
# cargo invocation directory, so one file here replaces the four byte-identical
# copies these harnesses used to carry. Keep it here rather than per-package --
# a harness that genuinely needs a different toolchain should say so by carrying
# its own file, which then reads as deliberate.
[toolchain]
channel = "nightly"
components = ["rust-src", "clippy", "rustfmt"]
