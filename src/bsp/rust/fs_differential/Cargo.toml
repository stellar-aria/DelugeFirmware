[package]
name = "fs-differential"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

[dependencies]
# embedded-fatfs is never published to crates.io; git-pinned to a rev.
embedded-fatfs = { git = "https://github.com/MabezDev/embedded-fatfs", rev = "518528cc111fcf65c48abbdeb80735a38eada112", default-features = false, features = ["lfn", "alloc"] }
embedded-io-async = "0.7"
block-device-adapters = "0.2"   # buffering/streaming adapters over a block device (same repo)

[build-dependencies]
cc = "1"
