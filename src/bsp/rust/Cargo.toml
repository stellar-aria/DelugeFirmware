# deluge-bsp-rust: the Rust/Embassy firmware image (Cargo-top). Implements the
# <libdeluge/...> C-ABI boundary for the Synthstrom Deluge (Renesas RZ/A1L) on
# top of the sibling deluge-sdk HAL+BSP, OWNS reset/main/_start + the Embassy
# executor, and links the portable C++ application (built by CMake into
# libdeluge_app.a) — running deluge_main() in one Embassy task.
#
# Standalone crate (NOT a workspace member). The path deps below sit inside the
# deluge-sdk Cargo workspace, so their `workspace = true` embassy pins resolve
# against that workspace and stay version-locked.
[package]
name = "deluge-bsp-rust"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "deluge-rust"
path = "src/main.rs"
test = false

[dependencies]
# Truly cross-target deps: same source, same versions, on both device and host.
embassy-sync = "0.8.0"
embassy-futures = "0.1.2"
log = "0.4"
rtt-target = { version = "0.6", features = ["log"], optional = true }

# Sibling deluge-sdk BSP + HAL (DelugeFirmware and deluge-sdk cloned side by
# side). Both are dual-target as of deluge-sdk's feat/deluge-bsp-host: `sd`
# (block_device.h's backing store) has the SAME async `Result<_, SdError>` API
# on host (a file-backed disk image) and device (the real SDHI1 driver), so
# `deluge-bsp-rust`'s `sd.rs` can call `deluge_bsp::sd::*` uniformly with no
# `#[cfg]` at the call site (see sd.rs). `rza1l-hal` is dual-target too
# (`target_os = "none"` gates its hardware-touching internals; its host build
# is effectively inert but the crate itself compiles either way). Both are
# therefore shared deps now rather than device-only.
# `flash` feature: deluge-bsp gates its `flash` module behind an opt-in feature
# (only flash-writing firmwares need it). We do — src/flash.rs reads device
# settings from the reserved SPI-flash sector via deluge_bsp::flash.
deluge-bsp = { path = "../../../../deluge-sdk/crates/deluge-bsp", features = ["flash"] }
rza1l-hal = { path = "../../../../deluge-sdk/crates/rza1l-hal" }

# ── Device (the Deluge, armv7a-none-eabihf) ──────────────────────────────────
# `deluge-alloc` (the general-purpose Rust heap) has no host meaning — the host
# harness links no C++ app and does no SDRAM bring-up (see build.rs) — so it
# stays device-only.
#
# `platform-cortex-ar` and `platform-std` (host, below) are mutually exclusive
# by embassy-executor's `check_at_most_one!`, so they must live in disjoint
# `[target...]` sections rather than both landing in `[dependencies]`.
[target.'cfg(target_os = "none")'.dependencies]
deluge-alloc = { path = "../../../../deluge-sdk/crates/deluge-alloc" }

# DelugeFirmware's own Rust crate providing the residency/eviction engine + the
# GeneralMemoryAllocator backing (TLSF + slab), both as C ABIs the C++ app calls.
# Linked here (not via the `deluge_rust` umbrella crate, which carries its own
# #[panic_handler] and would collide with ours) so the archived deluge_app object
# closure resolves its deluge_resource_* AND deluge_{alloc,slab_*} symbols. This is
# a distinct allocator from the sibling `deluge-alloc` above: disjoint memory,
# disjoint consumers (C++ app vs. Rust BSP), no C-symbol overlap. deluge_alloc
# rides in transitively (deluge_resource depends on it), so it stays out of this
# bin's extern prelude and doesn't clash with `use deluge_alloc` (the sibling).
deluge_resource = { path = "../../../crates/deluge_resource" }

# Embassy runtime — versions match deluge-sdk's workspace pins.
embassy-executor = { version = "0.10.0", features = ["nightly", "platform-cortex-ar", "executor-thread", "executor-interrupt"] }
embassy-time = { version = "0.5.1", features = ["tick-hz-1_000_000"] }
embassy-usb = "0.6.0"
embassy-usb-driver = "0.2.2"

cortex-ar = "0.3"
critical-section = "1"

# ── Host (x86/std) ────────────────────────────────────────────────────────────
# Same source, but the executor is std-thread-backed with no cortex-ar/BSP deps,
# so the Embassy scheduler/fiber concurrency can be exercised off-hardware
# (e.g. under ThreadSanitizer). No C++ app is linked on host (see build.rs).
[target.'cfg(not(target_os = "none"))'.dependencies]
embassy-executor = { version = "0.10.0", features = ["nightly", "platform-std", "executor-thread"] }
embassy-time = { version = "0.5.1", features = ["std"] }
critical-section = { version = "1", features = ["std"] }
# Host `main`'s logger (device uses `log` over RTT instead; see the `rtt` feature).
env_logger = "0.11"
# Host implementation of the fiber.rs low-level switch (`corosensei::Coroutine`/
# `Yielder`), standing in for the device's ARM `fiber_switch` global_asm. Its
# `sanitize` feature below was originally chosen with ThreadSanitizer in mind,
# but M1 Task 5 found it's actually ASan-only (see that feature's comment) —
# TSan itself needs no fiber annotations for a same-OS-thread coroutine switch
# (it tracks happens-before per real thread, not per stack), so the M1 Task 5
# TSan run does not enable this feature. Kept for a future ASan pass.
corosensei = "0.3"
# The host-built C++ `deluge_app` object closure (see build.rs, `host_app`
# feature) calls the deluge_resource_* residency C ABI and the
# deluge_{alloc,slab_*,heap_*} allocator C ABI — the same symbols the device
# build resolves via the `deluge_resource` dep above. `deluge_resource` and its
# `deluge_alloc` dependency are `#![cfg_attr(target_os = "none", no_std)]`, so on
# host they're plain std rlibs (no panic_handler, no dup-panic-handler risk) and
# link cleanly against std. Optional + gated by `host_app` so a plain host build
# (M1-M3 harness, no C++ app linked) never pulls it in.
deluge_resource = { path = "../../../crates/deluge_resource", optional = true }

[features]
default = ["rtt"]
## RTT (SEGGER Real-Time Transfer) logging over a debug probe. Selects the
## rza1l_rtt.x linker script (via build.rs) + registers the log logger.
rtt = ["dep:rtt-target", "rza1l-hal/rtt"]
## Enable corosensei's sanitizer instrumentation (host fiber switch only). OFF
## by default: enabling it without actually building under a sanitizer causes
## linker errors (the instrumentation calls into the sanitizer runtime, which
## isn't linked in a plain build). NOTE (M1 Task 5): this wires
## `__sanitizer_start/finish_switch_fiber` + `__asan_unpoison_memory_region` —
## AddressSanitizer's fiber-switch API. ThreadSanitizer's runtime
## (`librustc-nightly_rt.tsan.a`) does NOT implement that API (it has its own,
## unrelated `__tsan_create_fiber`/`__tsan_switch_to_fiber` family instead), so
## `--features sanitize` fails to link under `-Zsanitizer=thread` with
## undefined-symbol errors. This feature is therefore only usable under
## `-Zsanitizer=address`; the M1 Task 5 TSan run builds WITHOUT it (see
## HOST_HARNESS.md) and TSan neither needs nor benefits from it here — a
## same-thread corosensei stack switch has no other thread to misattribute
## happens-before to, unlike ASan's per-stack redzone tracking which does.
sanitize = ["corosensei/sanitizer"]
## Off by default. Bindgens the libdeluge C-ABI headers for the HOST ABI
## (x86-64 + `-fshort-enums`) into the real `mod sys` (replacing the M3
## `sys_host.rs` stand-ins) and links the host-built C++ `deluge_app` object
## closure (see build.rs). Lets the host binary reach the C++ app boundary for
## bring-up/link-checking without a device build. See m4a-spike-report.md.
## Pulls in the host-side `deluge_resource` dep above (dep:) so the linked
## object closure's deluge_resource_*/deluge_{alloc,slab_*,heap_*} symbols
## resolve — see host_link_stubs.rs for the remaining (peripheral) stubs.
host_app = ["dep:deluge_resource"]
## Off by default. Turns `deluge_storage_on_owner`'s single-owner discipline into
## an opt-in completeness diagnostic: `deluge_block_read`/`deluge_block_write`
## debug_assert! the caller is on the worker fiber. Until later async-sd rungs
## migrate the loader / MIDI-SysEx / recorder / UI FatFS access onto the fiber,
## most card transfers still legitimately happen off it, so this stays OFF for
## normal builds — enable it to see what's not yet migrated (it becomes the
## pre-flight gate at the rung-5 yield flip, where everything IS expected to be
## on the owner). See include/libdeluge/storage_owner.h.
storage-owner-audit = []
## Sim-only (host streaming-underrun harness). Gives host SD reads/writes a
## MODELED per-transfer latency and routes them through the same
## `on_fiber()`-guarded `block_on_fiber`/`block_on` shape the device transfer
## sites already use (rung 5), so a read/write issued on the storage-owner
## fiber genuinely SUSPENDS (yields to the executor) for the modeled delay
## instead of the plain host path's `block_on`-only (never-suspends) shape.
## Data is unchanged (still the real file-backed image) — only the observed
## TIMING is modeled. See `sd.rs`'s `sim_latency` module. OFF by default: with
## it off, `sd.rs`'s host `deluge_block_read`/`deluge_block_write` compile to
## exactly the code that existed before this feature — device/normal-host/
## golden builds are byte-unchanged.
sim_latency = []
## Off by default. Builds + spawns the R1/R2.1 async cluster-fill task
## (`streaming_loader.rs`): drains the resource manager's loader queue on this
## executor, awaiting the SD read instead of running it inline in the C++ fiber
## pump. The task's existence is gated by this feature, but the selector/wakeup
## C ABI it exposes (`deluge_streaming_async_active`/`deluge_streaming_signal_fill`)
## is always compiled on the Embassy BSP (device, or host under `host_app`) so the
## C++ side always has a real symbol to call — `async_active()`'s *return value*
## is what actually depends on this feature (false when off, so `loader.cpp`'s
## fiber pump behaves exactly as before: golden-bit-exact, this feature's whole
## reason for defaulting off). See streaming_loader.rs's module doc ("Two
## compilation tiers") for the split and the dependency-injection design that
## makes the drain loop host-testable without a real C++ resource manager.
async_streaming_loader = []

[build-dependencies]
# Generate Rust signatures + POD types from the canonical libdeluge C headers so
# the boundary can't drift (type mismatch = compile error).
bindgen = "0.70"

# Redirect embassy-executor to the local fork that ports the InterruptExecutor to
# platform-cortex-ar (GIC SGI pender). Same version (0.10.0), so this patch applies
# across the whole graph (this crate + the deluge-sdk path-deps), keeping the
# Executor/Spawner types identical everywhere.
#
# The integrated timer queue is *intrusive*: embassy-executor stores a
# `TimerQueueItem` in each task header (via embassy-executor-timer-queue), and
# embassy-time-queue-utils reads it back through `TimerQueueItem::from_embassy_waker`.
# `embassy-executor-timer-queue` carries no `links` key, so without these extra
# patches Cargo silently links TWO copies — the fork's (writing the task header,
# pulled in by the forked embassy-executor) and crates.io's (reading it, pulled in
# by the unpatched embassy-time-queue-utils the HAL driver uses). The two item
# types don't match, so `schedule_wake` reads a garbage item, thinks the task is
# already queued, and returns false → the hardware alarm is never armed → every
# `Timer::await` hangs forever. Patch the whole intrusive timer-queue pair to the
# fork so a single, consistent `TimerQueueItem` type is used on both sides.
[patch.crates-io]
embassy-executor = { git = "https://github.com/stellar-aria/embassy", branch = "feat/executor-interrupt-a9" }
embassy-executor-timer-queue = { git = "https://github.com/stellar-aria/embassy", branch = "feat/executor-interrupt-a9" }
embassy-time-queue-utils = { git = "https://github.com/stellar-aria/embassy", branch = "feat/executor-interrupt-a9" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = true
panic = "abort"

[profile.dev]
opt-level = 1
debug = true
panic = "abort"
