name: Rust

# CI for the Deluge Rust core (crates/) and the Rust BSP (src/bsp/rust/).
# fmt + clippy + nextest host tests on the `crates/` workspace, which builds on
# stable host targets (i686/x86_64) without -Z build-std. Test results publish
# through the shared test-results.yml pipeline (JUnit via nextest). The bare-metal
# BSP clippy/build (armv7a-none-eabihf, needs build-std + the deluge-sdk setup) is
# left as a TODO below; wire it in once the device build is reproducible in CI.

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
      - "release/**"
  merge_group:
  workflow_dispatch:

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Toolchain (nightly + components) is pinned by each rust-toolchain.toml;
      # rustup installs it on first cargo invocation. Ensure rustfmt is present.
      - name: Install rustfmt
        run: rustup component add rustfmt

      - name: rustfmt (crates)
        run: cargo fmt --manifest-path crates/Cargo.toml --all --check

      - name: rustfmt (bsp)
        run: cargo fmt --manifest-path src/bsp/rust/Cargo.toml --check

      - name: rustfmt (harness)
        run: |
          for m in harness/rust/*/Cargo.toml src/bsp/rust/harness/*/Cargo.toml; do
            cargo fmt --manifest-path "$m" --check
          done

  clippy:
    name: clippy (crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install clippy
        run: rustup component add clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates"

      - name: clippy (crates)
        run: cargo clippy --manifest-path crates/Cargo.toml --all-targets -- -D warnings

  clippy-harness:
    name: clippy (bsp + harnesses, host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup component add clippy
      - uses: Swatinem/rust-cache@v2
      # Host target only. The device target needs -Zbuild-std plus the
      # deluge-sdk setup and stays the separate TODO at the bottom of this file.
      - name: clippy (harness packages)
        run: |
          for m in harness/rust/*/Cargo.toml; do
            echo "== $m"
            cargo clippy --manifest-path "$m" --all-targets -- -D warnings
          done

  test:
    name: test (crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates"

      # nextest emits JUnit (crates/.config/nextest.toml, profile `ci`) so the
      # results feed the same publish pipeline as the C++ suites (test-results.yml).
      - uses: taiki-e/install-action@nextest

      - name: nextest (crates)
        run: cargo nextest run --manifest-path crates/Cargo.toml --profile ci

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Test Results Rust
          path: crates/target/nextest/ci/junit.xml

  # The publish-unit-test-result pipeline (test-results.yml) associates results
  # with the PR via the triggering event; upload it the same way tests.yml does.
  event_file:
    name: "Event File"
    runs-on: ubuntu-latest
    steps:
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: Event File
          path: ${{ github.event_path }}

  harness-matrix:
    name: harness matrix (pr)
    runs-on: ubuntu-latest
    outputs:
      harness: ${{ steps.emit.outputs.harness }}
    steps:
      - uses: actions/checkout@v7
      - id: emit
        run: echo "harness=$(DBT_NOENV=1 DBT_NO_SYNC=1 ./dbt harness ci --tier pr | jq -c .harness)" >> "$GITHUB_OUTPUT"

  harness:
    name: harness (${{ matrix.harness }})
    needs: harness-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        harness: ${{ fromJSON(needs.harness-matrix.outputs.harness) }}
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "crates"

      # Prerequisites the registry's probes look for. Cheap enough to install
      # unconditionally rather than per-harness; `dbt harness doctor` is the
      # authority on what each one needs.
      - name: Install harness prerequisites
        run: sudo apt-get update && sudo apt-get install -y mtools clang

      - name: Run harness
        run: DBT_NOENV=1 DBT_NO_SYNC=1 ./dbt harness run ${{ matrix.harness }}

  harness-index:
    name: harness index up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Regenerate the table and diff
        run: |
          DBT_NOENV=1 DBT_NO_SYNC=1 ./dbt harness list --markdown > /tmp/table.md
          sed -n '/BEGIN GENERATED TABLE/,/END GENERATED TABLE/p' harness/README.md \
            | sed '1d;$d' > /tmp/committed.md
          diff -u /tmp/committed.md /tmp/table.md || {
            echo "harness/README.md's table is stale -- regenerate it (see the README)."
            exit 1
          }

  # TODO: BSP clippy/build for armv7a-none-eabihf. Needs nightly -Z build-std
  # (rust-src is already pinned in src/bsp/rust/rust-toolchain.toml) and the
  # deluge-sdk toolchain setup. Add once the device build runs cleanly in CI:
  #
  # bsp:
  #   name: clippy (bsp)
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #     - run: rustup component add clippy rust-src
  #     - run: cargo clippy --manifest-path src/bsp/rust/Cargo.toml
  #             --target armv7a-none-eabihf -Z build-std=core,alloc -- -D warnings
